threats:
- id: T-P2-FEAT-001
  title: User restarts a host that is not their own (assignment confusion)
  stride: E
  target: P2
  description: If the Teams user is resolved by display name or e-mail instead of the Entra object id, or if HostAssignments
    is stale, the worker may restart another user's personal host or a pooled host. Requirements state pooled hosts
    must never be restarted.
  source: manual
  likelihood: 3
  impact: 4
  status: identified
  mitigations:
  - id: M-P2-FEAT-001-1
    description: Resolve the user strictly by Entra object id and tenant id from the validated JWT; restart only
      hosts whose assignment type is personal and whose assigned user id matches; cover with negative tests.
    domain: access_control
    status: proposed
- id: T-P1-FEAT-002
  title: Restart spam against a user's host (self-inflicted or via compromised Teams account)
  stride: D
  target: P1
  description: Repeated /restart-my-desktop commands could keep a host in a restart loop or exhaust ARM throttling
    limits for the host pool.
  source: manual
  likelihood: 3
  impact: 3
  status: identified
  mitigations:
  - id: M-P1-FEAT-002-1
    description: Enforce the one-restart-per-user-per-10-minutes limit server-side (not in the bot), and a per-host-pool
      concurrency cap; require the confirmation card when the admin setting is on.
    domain: availability_resilience
    status: proposed
- id: T-P2-FEAT-003
  title: Feature enabled on a host pool without admin intent
  stride: E
  target: P2
  description: The per-host-pool enable flag is the only control that stops any Teams user in the tenant from restarting
    hosts. If the flag defaults to on, or can be set by a non-admin role, the feature exposes restart to everyone.
  source: manual
  likelihood: 2
  impact: 3
  status: identified
  mitigations:
  - id: M-P2-FEAT-003-1
    description: Default the flag to off per host pool (secure default); restrict changing it to the NME admin role;
      log changes to the flag.
    domain: secure_defaults
    status: proposed
- id: T-P1-FEAT-004
  title: Spoofed bot activity from a different bot or tenant
  stride: S
  target: P1
  description: A JWT issued by Bot Framework for another bot (wrong audience) or a different Entra tenant (if the
    bot is multi-tenant) is accepted, letting an attacker in another tenant trigger restarts.
  source: manual
  likelihood: 3
  impact: 4
  status: identified
  mitigations:
  - id: M-P1-FEAT-004-1
    description: Validate issuer, audience (this bot's app id), expiry and signing key via Bot Framework OpenID
      metadata; reject activities whose tenant id is not the NME customer tenant.
    domain: authentication_identity
    status: proposed
- id: T-E1-S-004
  title: Third-party system AVD end user (Teams client) is impersonated or compromised
  stride: S
  target: E1
  description: A compromised or spoofed third party (PSA/RMM, IdP, partner API) sends malicious data to Nerdio.
  source: generated
  library_ref: LIB-S-004
  likelihood: 4
  impact: 3
  status: identified
  mitigations:
  - id: M-E1-S-004-1
    description: Pin endpoints to vendor-documented hosts over TLS 1.2+; validate certificates.
    domain: api_security
    status: proposed
  - id: M-E1-S-004-2
    description: Treat all third-party responses as untrusted input; schema-validate before use.
    domain: input_validation_output_encoding
    status: proposed
- id: T-E1-R-001
  title: Actions performed through AVD end user (Teams client) cannot be attributed
  stride: R
  target: E1
  description: Security-relevant actions (create/delete resources, permission changes, data export) are not logged
    with actor, tenant and correlation ID.
  source: generated
  library_ref: LIB-R-001
  likelihood: 4
