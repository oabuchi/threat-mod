schema_version: '1.0'
id: TM-NME-52310
feature:
  title: Self-service session host restart from Microsoft Teams
  product: NME
  description: AVD end users send /restart-my-desktop to the Nerdio Teams bot. Azure Bot Service forwards the activity
    to a new NME endpoint, which resolves the user's assigned personal session host from the NME database and restarts
    it through ARM using the NME managed identity, then confirms in Teams. Admins enable the feature per host pool
    and every restart is audit-logged.
  owner:
    name: Priya Example
    role: development_team
  work_item: https://dev.azure.com/nerdio/NME/_workitems/edit/52310
status: draft
tier: 2
last_updated: '2026-11-05'
data_classification: confidential
triage:
  architectural_change: true
  data_handling_change: true
  new_integration: true
  authn_authz_change: true
  new_external_entry_point: true
  privileged_azure_operation: true
  cross_tenant_data: false
  restricted_data: false
  cryptography_change: false
assets:
- id: A1
  name: Teams activity payload (display name, Entra object id, tenant id, message text)
  classification: confidential
  description: Personal data of the end user received from Bot Service
- id: A2
  name: Host assignment mapping (user id -> VM resource id)
  classification: confidential
  description: Existing HostAssignments table
- id: A3
  name: Customer session host VMs
  classification: restricted
  description: Customer compute that can be restarted via ARM
- id: A4
  name: NME audit log
  classification: confidential
  description: Who restarted what, when, result
- id: A5
  name: Bot app credentials / Bot Framework token
  classification: restricted
  description: Used to validate inbound JWT and send confirmation cards
trust_zones:
- id: Z0
  name: Internet / Microsoft 365
  trust: 0
  description: Teams clients and Azure Bot Service
- id: Z1
  name: NME App Service (customer Azure subscription)
  trust: 7
  description: NME application tier
- id: Z2
  name: Customer Azure resources
  trust: 6
  description: ARM control plane and Log Analytics in the customer subscription
elements:
- id: E1
