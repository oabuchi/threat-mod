schema_version: '1.0'
id: TM-NMM-48211
feature:
  title: PSA ticket webhook triggers Scripted Actions
  product: NMM
  description: MSPs configure their PSA (e.g. ConnectWise/Autotask) to send a webhook when a ticket is created.
    NMM matches the ticket to a customer tenant and runs an approved Scripted Action against that customer's Azure
    environment using the NMM-managed identity.
  owner:
    name: Jordan Example
    email: jordan@example.com
    role: development_team
  work_item: https://dev.azure.com/nerdio/NMM/_workitems/edit/48211
  repositories:
  - nerdio/nmm-core
  target_release: NMM 7.4
status: approved
tier: 2
last_updated: '2026-11-04'
data_classification: restricted
triage:
  architectural_change: true
  data_handling_change: true
  new_integration: true
  authn_authz_change: false
  new_external_entry_point: true
  privileged_azure_operation: true
  cross_tenant_data: true
  restricted_data: true
  cryptography_change: false
assets:
- id: A1
  name: PSA webhook signing secret
  classification: restricted
- id: A2
  name: Ticket payload (customer name, user email, description)
  classification: confidential
- id: A3
  name: Scripted Action content and parameters
  classification: confidential
- id: A4
  name: Customer Azure resources (session hosts, storage)
  classification: restricted
- id: A5
  name: Execution audit log
  classification: confidential
trust_zones:
- id: Z0
  name: Internet / MSP PSA
  trust: 0
- id: Z1
  name: NMM App (Azure, Nerdio-managed)
  trust: 7
- id: Z2
  name: NMM Data plane (private endpoints)
  trust: 9
- id: Z3
  name: Customer Azure tenant
  trust: 5
elements:
- id: E1
  name: MSP PSA system
  type: external_entity
  zone: Z0
  technology: Third-party SaaS webhook
- id: P1
  name: Webhook receiver
  type: process
  zone: Z1
  technology: Azure Function (webhook, .NET 8)
  internet_facing: true
  multi_tenant: true
  holds_assets:
  - A1
  - A2
- id: P2
  name: Scripted Action orchestrator
  type: process
  zone: Z1
  technology: App Service worker, PowerShell scripted action runner, managed identity (ARM)
  multi_tenant: true
  holds_assets:
  - A3
- id: D1
  name: NMM Key Vault
  type: data_store
  zone: Z2
  technology: Azure Key Vault
  holds_assets:
  - A1
- id: D2
  name: NMM SQL database
  type: data_store
  zone: Z2
  technology: Azure SQL
  multi_tenant: true
  holds_assets:
  - A3
  - A5
- id: E2
  name: Customer Azure subscription (ARM)
  type: external_entity
  zone: Z3
  technology: Azure Resource Manager
  holds_assets:
  - A4
data_flows:
- id: F1
  from: E1
  to: P1
  protocol: HTTPS webhook
  assets:
  - A2
  authenticated: true
  encrypted: true
- id: F2
  from: P1
  to: P2
  protocol: Service Bus queue
  assets:
  - A2
  authenticated: true
  encrypted: true
- id: F3
  from: P1
  to: D1
  protocol: HTTPS (Key Vault SDK)
  assets:
  - A1
  authenticated: true
  encrypted: true
- id: F4
  from: P2
  to: D2
  protocol: TDS/TLS
  assets:
  - A3
  - A5
  authenticated: true
  encrypted: true
- id: F5
  from: P2
  to: E2
  protocol: HTTPS (ARM REST)
  assets:
  - A4
  authenticated: true
  encrypted: true
entry_points:
- id: EP1
  element: P1
  description: POST /api/psa/{mspId}/webhook
  authentication: HMAC-SHA256 signature per MSP
  internet_facing: true
- id: EP2
  element: P2
  description: Service Bus queue consumer
  authentication: Managed identity (RBAC on queue)
  internet_facing: false
threats:
- id: T-E1-S-004
  title: Third-party system MSP PSA system is impersonated or compromised
  stride: S
  target: E1
  description: A compromised or spoofed third party (PSA/RMM, IdP, partner API) sends malicious data to Nerdio.
  source: generated
  library_ref: LIB-S-004
  likelihood: 4
  impact: 4
  status: mitigation_planned
  mitigations:
  - id: M-E1-S-004-1
    description: Pin endpoints to vendor-documented hosts over TLS 1.2+; validate certificates.
    domain: api_security
    status: planned
    work_item: https://dev.azure.com/nerdio/NMM/_workitems/edit/48231
  - id: M-E1-S-004-2
    description: Treat all third-party responses as untrusted input; schema-validate before use.
    domain: input_validation_output_encoding
    status: planned
    work_item: https://dev.azure.com/nerdio/NMM/_workitems/edit/48232
  residual:
    likelihood: 2
    impact: 4
- id: T-E1-R-001
  title: Actions performed through MSP PSA system cannot be attributed
  stride: R
  target: E1
  description: Security-relevant actions (create/delete resources, permission changes, data export) are not logged
    with actor, tenant and correlation ID.
  source: generated
  library_ref: LIB-R-001
  likelihood: 4
  impact: 4
  status: transferred
  mitigations:
  - id: M-E1-R-001-1
    description: Emit audit events (actor, tenant/MSP, action, target, result, correlation ID, UTC time) to centralized
      tamper-evident logging.
    domain: error_handling_logging
    status: proposed
  - id: M-E1-R-001-2
    description: Retain audit logs per the Logging and Monitoring Policy; restrict deletion.
    domain: error_handling_logging
    status: proposed
  rejection_reason: Attribution of actions inside the MSP's PSA is the PSA vendor's/MSP's responsibility (shared-responsibility
    model, documented in NMM admin guide).
- id: T-P1-S-001
  title: Attacker impersonates a legitimate caller of Webhook receiver
  stride: S
  target: P1
  description: An unauthenticated or weakly authenticated party presents stolen or forged credentials/tokens to
    Webhook receiver.
  source: generated
  library_ref: LIB-S-001
  likelihood: 4
  impact: 4
  status: rejected
  mitigations:
  - id: M-P1-S-001-1
    description: Require Entra ID (OIDC/OAuth 2.0) authentication with MFA enforced via Conditional Access for interactive
      users.
    domain: authentication_identity
    status: proposed
  - id: M-P1-S-001-2
    description: Validate token issuer, audience, signature, expiry and tenant (tid) claim on every request.
    domain: authentication_identity
    status: proposed
  rejection_reason: Webhook caller is a machine (PSA), not an interactive user; caller authentication is handled
    by T-P1-S-002 (HMAC).
- id: T-P1-S-002
  title: Forged inbound event/webhook accepted by Webhook receiver
  stride: S
  target: P1
  description: An attacker sends crafted events to Webhook receiver that appear to come from a trusted publisher.
  source: generated
  library_ref: LIB-S-002
  likelihood: 4
  impact: 4
  status: mitigation_planned
  mitigations:
  - id: M-P1-S-002-1
    description: Verify HMAC/signature or validation handshake on every inbound event; reject unsigned payloads.
    domain: api_security
    status: planned
    work_item: https://dev.azure.com/nerdio/NMM/_workitems/edit/48233
  - id: M-P1-S-002-2
    description: Enforce timestamp/nonce replay window (≤5 min) on inbound events.
    domain: api_security
    status: planned
    work_item: https://dev.azure.com/nerdio/NMM/_workitems/edit/48234
  residual:
    likelihood: 2
    impact: 4
- id: T-P1-S-003
  title: Service-to-service identity of Webhook receiver spoofed or credentials stolen
  stride: S
  target: P1
  description: Shared secrets or client secrets used by Webhook receiver are leaked and reused to impersonate the
    service.
  source: generated
  library_ref: LIB-S-003
  likelihood: 4
  impact: 4
  status: mitigation_planned
  mitigations:
  - id: M-P1-S-003-1
    description: Use Azure Managed Identity / workload identity federation instead of client secrets.
    domain: secrets_management
    status: planned
    work_item: https://dev.azure.com/nerdio/NMM/_workitems/edit/48235
  - id: M-P1-S-003-2
    description: Where secrets are unavoidable, store in Key Vault with rotation ≤90 days and secrets scanning on
      every commit.
    domain: secrets_management
    status: planned
    work_item: https://dev.azure.com/nerdio/NMM/_workitems/edit/48236
  residual:
    likelihood: 2
    impact: 4
- id: T-P1-T-005
  title: Build or deployment artifact of Webhook receiver tampered with
  stride: T
  target: P1
  description: A compromised dependency, pipeline or artifact injects malicious code into Webhook receiver.
  source: generated
  library_ref: LIB-T-005
  likelihood: 4
  impact: 4
  status: mitigation_planned
  mitigations:
  - id: M-P1-T-005-1
    description: Only use dependencies from the Approved Tools/Library List; SCA (Aikido) must pass.
    domain: third_party_components
    status: planned
    work_item: https://dev.azure.com/nerdio/NMM/_workitems/edit/48237
  - id: M-P1-T-005-2
    description: Deploy only via the approved Azure DevOps pipeline with integrity-verified artifacts (SSDF PS.2).
    domain: third_party_components
    status: planned
    work_item: https://dev.azure.com/nerdio/NMM/_workitems/edit/48238
  residual:
    likelihood: 2
    impact: 4
