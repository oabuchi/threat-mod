- id: T-P1-I-002
  title: Cross-tenant data exposure in Webhook receiver
  stride: I
  target: P1
  description: Missing or incorrect tenant/MSP scoping lets one customer (or MSP) read another's data — insecure
    direct object reference across tenants.
  source: generated
  library_ref: LIB-I-002
  likelihood: 4
  impact: 5
  status: mitigation_planned
  mitigations:
  - id: M-P1-I-002-1
    description: Derive tenant/MSP scope from the authenticated token, never from request parameters; enforce in
      a shared data-access layer.
    domain: tenant_isolation
    status: planned
    work_item: https://dev.azure.com/nerdio/NMM/_workitems/edit/48241
  - id: M-P1-I-002-2
    description: Add automated cross-tenant authorization tests (tenant A cannot read/act on tenant B) to the CI
      suite.
    domain: tenant_isolation
    status: planned
    work_item: https://dev.azure.com/nerdio/NMM/_workitems/edit/48242
  residual:
    likelihood: 2
    impact: 5
