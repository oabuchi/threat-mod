# Intake (ISMS-DEV-004 §5.0): when a "Threat model intake" issue is opened or edited, run
# `threatmod intake` on the form, post the triage result and routing back on the issue, and
# label it with the intake state. Nothing is committed; the Security Team accepts the request
# by moving it to "accepted" (label) and the owner creates the model under threat-models/.
name: threat-model-intake

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    if: contains(github.event.issue.labels.*.name, 'intake')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: oabuchi/threat-mod, path: threatmod-home }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r threatmod-home/requirements.txt

      - name: Run intake triage
        id: intake
        env:
          BODY: ${{ github.event.issue.body }}
          TITLE: ${{ github.event.issue.title }}
          NUMBER: ${{ github.event.issue.number }}
          PYTHONPATH: ${{ github.workspace }}/threatmod-home
          THREATMOD_HOME: ${{ github.workspace }}/threatmod-home
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          id="TM-INTAKE-$NUMBER"
          set +e
          python -m threatmod intake "$RUNNER_TEMP/body.md" --id "$id" --issue-title "$TITLE" --dry-run --format json > "$RUNNER_TEMP/out.txt"
          code=$?
          set -e
          state=$(python -c "import json,sys;t=open('$RUNNER_TEMP/out.txt').read();print(json.loads(t[t.index('{'):])['state'])")
          tier=$(python -c "import json;t=open('$RUNNER_TEMP/out.txt').read();print(json.loads(t[t.index('{'):])['tier'])")
          echo "state=$state" >> "$GITHUB_OUTPUT"; echo "tier=$tier" >> "$GITHUB_OUTPUT"
          { echo '```'; sed -n '1,/^{/p' "$RUNNER_TEMP/out.txt" | sed '$d'; echo '```'; } > "$RUNNER_TEMP/comment.md"
          exit 0

      - name: Comment and label
        uses: actions/github-script@v7
        env:
          STATE: ${{ steps.intake.outputs.state }}
          TIER: ${{ steps.intake.outputs.tier }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.RUNNER_TEMP + '/comment.md', 'utf8');
            const state = process.env.STATE, tier = process.env.TIER;
            const next = {
              closed_tier0: 'No threat model required. This record is retained as evidence; re-submit if the scope changes.',
              needs_info: 'Please add the missing items to the **Intake package** field (edit this issue) — triage re-runs automatically.',
              accepted: tier === '2'
                ? 'Accepted at **Tier 2**. The Security Team assigns a facilitator within 2 working days and schedules the STRIDE session within 5. Create the model with `threatmod intake` (or `threatmod assess` from the attachments) under `threat-models/`.'
                : 'Accepted at **Tier 1**. Create the model with `threatmod init`/`assess`, run `generate`, and request peer design approval; the Security Team spot-reviews.',
            }[state] || '';
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number,
              body: `## Intake triage (ISMS-DEV-004 §5.0)\n\n${body}\n\n${next}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_` });
            const labels = ['intake', `intake:${state.replace('_', '-')}`, `tier:${tier}`];
            const current = (await github.rest.issues.listLabelsOnIssue({ ...context.repo, issue_number: context.issue.number })).data.map(l => l.name);
            for (const l of current.filter(l => l.startsWith('intake:') || l.startsWith('tier:')))
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: context.issue.number, name: l }).catch(() => {});
            await github.rest.issues.addLabels({ ...context.repo, issue_number: context.issue.number, labels });
            if (state === 'closed_tier0')
              await github.rest.issues.update({ ...context.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed' });
